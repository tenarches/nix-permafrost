# Declares the host-side secrets the launcher reads. The values live in
# whichever secretspec provider the launching user has configured
# (`secretspec config init`), never in the repo or the Nix store.
#
# `nix run .#permafrost` reads these as the launching user, mints a
# single-use tailnet auth key from them, and hands the guest only that key.
[project]
name = "permafrost"
revision = "1.0"

[profiles.default]
TS_OAUTH_CLIENT_ID = { description = "Tailscale OAuth client id (scope auth_keys, restricted to tag:permafrost-guest)", required = false }
TS_OAUTH_CLIENT_SECRET = { description = "Tailscale OAuth client secret", required = false }
