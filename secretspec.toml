# Declares the host-side secrets the launcher reads. The values live in the
# launching user's `pass` store, at the entries named by `ref` below, never in
# the repo or the Nix store.
#
# `nix run .#permafrost` reads these as the launching user, mints a
# single-use tailnet auth key from them, and hands the guest only that key.
[project]
name = "permafrost"
revision = "1.0"

[profiles.default]
TS_OAUTH_CLIENT_ID = { description = "Tailscale OAuth client id (scope auth_keys, restricted to tag:permafrost-guest)", required = false, providers = ["pass"], ref = { item = "tailscale/sandbox_client_id" } }
TS_OAUTH_CLIENT_SECRET = { description = "Tailscale OAuth client secret", required = false, providers = ["pass"], ref = { item = "tailscale/sandbox_client_secret" } }
DSH_SESSION_SECRET = { description = "dsh browser-session signing secret: 43-character base64url of 32 random bytes", required = false, providers = ["pass"], ref = { item = "dsh/session_secret" } }
